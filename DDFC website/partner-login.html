<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDFC CRM — Admin Panel</title>
<style>
:root{--red:#ff3650;--red2:#d91f39;--navy:#101b4c;--navy2:#24377f;--ink:#111936;--muted:#6c7592;--bg:#f4f7fc;--card:#fff;--line:#e5e9f2;--green:#16b866;--amber:#e9a51b;--blue:#4567e8;--shadow:0 16px 45px rgba(16,27,76,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 20%,#ffdce1,transparent 28%),radial-gradient(circle at 85% 10%,#dfe6ff,transparent 30%),var(--bg)}
.login-card{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 30px 80px rgba(16,27,76,.16)}
.logo{height:54px;max-width:230px;object-fit:contain;margin-bottom:25px}.login h1{margin:0;font-size:27px}.login p{color:var(--muted);font-size:14px}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#f9fbff;border-radius:10px;padding:12px 13px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(69,103,232,.1)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:750}.primary{background:linear-gradient(135deg,#ff3650,#d91f39);color:#fff}.secondary{background:#eef2ff;color:var(--navy)}.success{background:#e8fbf1;color:#087a42}.danger{background:#fff0f2;color:#b21f36}.ghost{background:transparent;color:var(--muted)}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:linear-gradient(180deg,#ffffff,#f4f6fb);color:#172044;padding:22px 16px;position:sticky;top:0;height:100vh}.side-logo{width:185px;max-height:58px;object-fit:contain;object-position:left center;margin:4px 8px 30px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.18))}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;color:#56617f;text-align:left;padding:12px 13px;border-radius:10px;font-weight:650}.nav button:hover,.nav button.active{background:#eef1f8;color:#172044}.side-bottom{position:absolute;bottom:20px;left:16px;right:16px;color:#8a93ab;font-size:12px}
.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.top-title{font-weight:800}.user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.avatar{width:35px;height:35px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
.content{padding:28px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:22px}.page-head h2{margin:0;font-size:26px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .num{font-size:28px;font-weight:850;margin-top:6px}.stat .delta{font-size:11px;color:var(--green);margin-top:4px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h3{font-size:15px;margin:0}.panel-body{padding:18px}
.chart{height:250px;display:flex;align-items:end;gap:9px;padding:15px 4px 5px}.bar{flex:1;background:linear-gradient(180deg,#ff6a7b,#ff3650);border-radius:6px 6px 2px 2px;min-width:12px;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.table-wrap{overflow:auto}.toolbar{display:flex;gap:9px;flex-wrap:wrap;padding:15px;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcff}.toolbar input{min-width:240px}table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:13px 15px;border-bottom:1px solid #eef1f6;text-align:left;font-size:12.5px}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fbfcff}tr:hover td{background:#fcfdff}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}.new{background:#eef2ff;color:#3454c5}.contacted{background:#fff5dd;color:#a36a00}.docs{background:#e9f5ff;color:#1870a5}.approved{background:#e7faef;color:#087a42}.rejected{background:#fff0f2;color:#b21f36}.disbursed{background:#e8fbf1;color:#087a42}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mini{border:1px solid var(--line);border-radius:13px;padding:15px}.mini strong{display:block}.mini small{color:var(--muted)}.progress{height:7px;background:#edf0f7;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--red);border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(8,15,45,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modal-card{background:#fff;width:min(720px,96vw);max-height:90vh;overflow:auto;border-radius:18px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.modal-card h3{margin:0 0 5px}.modal-head{display:flex;justify-content:space-between}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.toast{position:fixed;right:20px;bottom:20px;background:#101b4c;color:#fff;padding:13px 16px;border-radius:10px;display:none;z-index:100;box-shadow:var(--shadow)}
.empty{padding:45px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.shell{grid-template-columns:76px 1fr}.sidebar{padding:18px 10px}.side-logo{width:50px;object-fit:cover;object-position:left}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:20px}.side-bottom{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:650px){.content{padding:16px}.stats{grid-template-columns:1fr 1fr;gap:10px}.page-head{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.topbar{padding:0 16px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <img id="loginLogo" class="logo" alt="DDFC">
    <h1>CRM Admin Login</h1>
    <p>Manage DDFC personal-loan enquiries, applications, team members and lender partners.</p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" required></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" required></div>
      <button class="btn primary" style="width:100%;margin-top:7px">Sign in</button>
    </form>
    <p style="margin-top:16px;font-size:11px">Connected to the DDFC CRM API — sign in with your team account.</p>
  </div>
</div>

<div id="app" class="shell hidden">
<aside class="sidebar">
  <img id="sideLogo" class="side-logo" alt="DDFC">
  <div class="nav">
    <button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button>
    <button data-page="teamdashboard">◫ &nbsp; Team Dashboard</button>
    <button data-page="leads">◉ &nbsp; Leads</button>
    <button data-page="applications">▣ &nbsp; Applications</button>
    <button data-page="customers">◌ &nbsp; Customers</button>
    <button data-page="lenders">◇ &nbsp; Lender Partners</button>
    <button data-page="team">♙ &nbsp; Team & Roles</button>
    <button data-page="reports">◒ &nbsp; Reports</button>
    <button data-page="settings">⚙ &nbsp; Settings</button>
  </div>
  <div class="side-bottom">DDFC CRM v1.0<br>Dual DSA Fin Corp</div>
</aside>
<main class="main">
<header class="topbar"><div class="top-title" id="topTitle">Dashboard</div><div class="user"><span>CRM</span><div class="avatar">SA</div><button class="btn ghost" onclick="logout()">Logout</button></div></header>
<div class="content" id="content"></div>
</main>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

function openWhatsApp(id){
 const lead=db.leads.find(x=>x.id===id);
 if(!lead){return}
 const number=(db.whatsappNumber||'').replace(/\D/g,'');
 if(!number || number==='919999999999'){
   alert('Please set your DDFC WhatsApp business number in CRM Settings → WhatsApp Chat first.');
   show('settings'); return;
 }
 const msg=(db.whatsappMessage||'Hello DDFC, I am interested in a personal loan.')
   + '\\n\\nLead details:\\nName: '+lead.name+'\\nPhone: '+lead.phone+'\\nEmail: '+lead.email+'\\nLoan amount: '+money(lead.amount)+'\\nLead ID: '+lead.id;
 window.open('https://wa.me/'+number+'?text='+encodeURIComponent(msg),'_blank');
}
function exportCSV(){let cols=['id','name','phone','email','city','amount','status','source','owner','date'];let csv=[cols.join(','),...db.leads.map(x=>cols.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(','))].join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ddfc-leads.csv';a.click();URL.revokeObjectURL(a.href)}
async function resetDemo(){try{await loadAll();show(currentUser&&currentUser.role==='Super Admin'?'dashboard':'teamdashboard');toast('Data refreshed from server')}catch(err){alert(err.message)}}

let currentUser=null;
document.getElementById('loginForm').onsubmit=async ev=>{
 ev.preventDefault();
 const email=loginEmail.value.trim().toLowerCase();
 const password=loginPassword.value;
 try{
   const {token,user}=await api('/auth/login',{method:'POST',body:JSON.stringify({email,password})});
   authToken=token;localStorage.setItem('ddfcToken',token);
   currentUser=user;
   await loadAll();
   document.getElementById('login').classList.add('hidden');
   document.getElementById('app').classList.remove('hidden');
   document.querySelector('.user span').textContent=user.name+' · '+user.role;
   document.querySelector('.avatar').textContent=user.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
   if(user.role==='Super Admin') show('dashboard');
   else show('teamdashboard');
 }catch(err){
   alert(err.message || 'Invalid email or password.');
 }
};
